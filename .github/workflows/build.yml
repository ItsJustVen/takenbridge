name: Build TakenBridge

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the plugin
        run: gradle build --no-daemon

      - name: Keep the jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TakenBridge
          path: build/libs/TakenBridge.jar

      - name: Move the "latest" tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish the jar on the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }}. Download TakenBridge.jar and put it in the server's plugins folder."
          files: build/libs/TakenBridge.jar
          make_latest: true
